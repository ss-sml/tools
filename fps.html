<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FPS Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    #fps {
      font-size: 80px;
      font-weight: bold;
      color: #0f0;
    }
    #arena {
      width: 400px;
      height: 100px;
      background: #222;
      border: 1px solid #444;
      position: relative;
      margin-top: 20px;
    }
    #block {
      width: 40px;
      height: 40px;
      background: #0f0;
      position: absolute;
      top: 30px;
    }
  </style>
</head>
<body>
  <div id="fps">0</div>
  <div id="arena">
    <div id="block"></div>
  </div>
  <script>
    var fpsEl = document.getElementById('fps');
    var blockEl = document.getElementById('block');
    
    var lastTime = Date.now();
    var frameCount = 0;
    var fps = 0;
    
    var pos = 0;
    var dir = 1;
    
    function loop() {
      var now = Date.now();
      frameCount++;
      
      if (now - lastTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastTime = now;
        fpsEl.innerHTML = fps;
      }
      
      pos += dir * 2;
      
      if (pos >= 360) dir = -1;
      if (pos <= 0) dir = 1;
      
      blockEl.style.transform = 'translateX(' + pos + 'px)';
      
      requestAnimationFrame(loop);
    }
    
    loop();
  </script>
</body>
</html>
