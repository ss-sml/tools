<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Touch Drag Test</title>
  <style>
    body {
      margin: 0;
      background: #222;
      height: 100vh;
      overflow: hidden; /* Отключаем скролл страницы */
      font-family: Arial, sans-serif;
    }
    
    #fps {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #0f0;
      font-size: 40px;
      z-index: 100;
      pointer-events: none;
    }

    #box {
      width: 100px;
      height: 100px;
      background: #f00;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 10px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: grab;
      
      /* ГЛАВНОЕ: отключает браузерную обработку жестов (скролл/зум) для этого элемента */
      touch-action: none;
    }
  </style>
</head>
<body>

  <div id="fps">60</div>
  <div id="box">DRAG</div>

  <script>
    var fpsEl = document.getElementById('fps');
    var box = document.getElementById('box');
    box.style.transform = 'translate(' + 100 + 'px, ' + 100 + 'px)';
    
    // Переменные для FPS
    var lastTime = Date.now();
    var frames = 0;
    
    // Переменные для перетаскивания
    var isDragging = false;
    var startX = 100;
    var startY = 100;
    var currentX = 50;
    var currentY = 50;

    // 1. Измеритель FPS
    function loop() {
      var now = Date.now();
      frames++;
      
      if (now - lastTime >= 1000) {
        fpsEl.innerHTML = frames;
        frames = 0;
        lastTime = now;
      }
      
      requestAnimationFrame(loop);
    }
    loop();

    // 2. Обработка Touch событий
    
    box.addEventListener('touchstart', function(e) {
      isDragging = true;
      
      // Запоминаем, где палец встал относительно экрана
      var touch = e.touches[0];
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
      
      box.style.background = '#a00'; // Визуальный фидбек
    }, { passive: false });

    box.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      
      // ОБЯЗАТЕЛЬНО: блокируем скролл страницы, иначе будут лаги
      e.preventDefault(); 
      
      var touch = e.touches[0];
      
      // Вычисляем новую позицию
      currentX = touch.clientX - startX;
      currentY = touch.clientY - startY;
      
      // Двигаем блок
      box.style.transform = 'translate(' + currentX + 'px, ' + currentY + 'px)';
      
    }, { passive: false }); // passive: false нужен, чтобы работал preventDefault

    box.addEventListener('touchend', function(e) {
      isDragging = false;
      box.style.background = '#f00';
    });
    
    // Дублируем логику для мыши (чтобы тестить на компе)
    box.addEventListener('mousedown', function(e) {
      isDragging = true;
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
      box.style.background = '#a00';
    });
    
    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      box.style.transform = 'translate(' + currentX + 'px, ' + currentY + 'px)';
    });
    
    window.addEventListener('mouseup', function() {
      isDragging = false;
      box.style.background = '#f00';
    });

  </script>
</body>
</html>
